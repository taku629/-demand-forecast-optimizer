[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "inventory-optimizer"
version = "0.1.0"
description = "需要予測 × 在庫最適化システム（丸紅インターン向けポートフォリオ）"
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.0",
    "pulp>=2.7",
    "streamlit>=1.30",
    "plotly>=5.18",
    "pandas>=2.0",
    "numpy>=1.26",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.8",
    "pandas-stubs>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing --cov-report=xml"
filterwarnings = ["ignore::UserWarning"]

[tool.coverage.run]
omit = ["tests/*", "data/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = [
    "ANN401",  # Any type
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
"app.py" = ["ANN", "E501"]  # Streamlit UIコードは行長・型注釈を緩和

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
exclude = ["data/"]
